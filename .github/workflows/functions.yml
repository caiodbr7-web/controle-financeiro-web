name: Deploy edge functions (Supabase)

# Faz o deploy automático das edge functions de supabase/functions/ no projeto
# de produção, sempre que algo mudar nessa pasta na branch main.
#
# Pré-requisito (uma vez só): cadastrar em
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
# o secret SUPABASE_ACCESS_TOKEN com um token de acesso pessoal do Supabase
# (https://supabase.com/dashboard/account/tokens → Generate new token).
# O project-ref abaixo é público (é o mesmo da URL do projeto); o token nunca
# aparece no código, nos logs nem no histórico do git.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/functions.yml"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy das functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado. Veja o cabeçalho deste workflow."
            exit 1
          fi
          supabase functions deploy --project-ref qjotxjunuurfezqgtugr
